name: Deploy to Asus

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-asus-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.sha }}
    runs-on: [self-hosted, linux, x64, asus]
    timeout-minutes: 20
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Update vcobs and verify health
        shell: bash
        env:
          DEPLOY_SHA: "${{ github.sha }}"
        run: |
          set -Eeuo pipefail

          deploy_dir="$HOME/vcobs"
          test -d "$deploy_dir/.git"
          cd "$deploy_dir"

          git fetch --force origin "$DEPLOY_SHA"
          git checkout --detach --force "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

          docker compose up -d --build

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3080/api/health; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --tail=100
          exit 1
